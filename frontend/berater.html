<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sideboard Konfigurator | KI Berater</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div style="margin-bottom: 2rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Zurück</a>
    </div>

    <div class="ai-advisor">
      <h1 class="page-title">Raum-Berater</h1>
      <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;">
        Unsere KI analysiert deine Sideboard-Konfiguration und hilft bei der Entscheidung.
      </p>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem;">
        <button class="btn-secondary" onclick="holeBeraterTipp('styling')">Styling & Farben</button>
        <button class="btn-secondary" onclick="holeBeraterTipp('deco')">Dekorationsideen</button>
        <button class="btn-secondary" onclick="holeBeraterTipp('room_layout')">Raumaufteilung</button>
      </div>

      <div class="ai-bubble" id="beraterAntwort" style="display: none;">
        <div style="display: flex; gap: 1rem; align-items: flex-start;">
          <div style="font-size: 2rem; background: var(--bg-light); border-radius: 50%; padding: 0.5rem;">💡</div>
          <div>
            <p id="beraterText" style="line-height: 1.6;"></p>
            <span class="ai-source" id="beraterQuelle"></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function holeBeraterTipp(type) {
      const antwortDiv = document.getElementById("beraterAntwort");
      const beraterText = document.getElementById("beraterText");
      const beraterQuelle = document.getElementById("beraterQuelle");

      beraterText.textContent = "Analysiere Konfiguration und generiere Tipp...";
      beraterQuelle.textContent = "";
      antwortDiv.style.display = "block";

      try {
        const antwort = await fetch(`${API}/ai/advice`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ type })
        });

        const daten = await antwort.json();

        if (daten.fehler) {
          beraterText.textContent = daten.fehler;
        } else {
          beraterText.textContent = daten.advice;
          beraterQuelle.textContent = daten.cached 
            ? "Antwort aus dem Cache geladen (Sofort)" 
            : "Live generiert von Gemini AI";
        }
      } catch (err) {
        beraterText.textContent = "Netzwerkfehler.";
      }
    }
  </script>
</body>
</html>
