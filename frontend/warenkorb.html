<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FruitDrink | Warenkorb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🍹 FruitDrink Co.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="konfigurator.html">Konfigurator</a>
      <a href="shop.html">Shop</a>
      <a href="impressionen.html">Impressionen</a>
      <a href="community.html">Community</a>
    </div>
  </nav>

  <main>
    <div style="margin-bottom: 2rem;">
      <a href="shop.html" style="color: var(--text-muted); text-decoration: none;">&larr; Weiter einkaufen</a>
    </div>

    <h1 class="page-title">🛒 Warenkorb</h1>

    <div class="cart-layout" id="cartLayout">
      <ul class="cart-items" id="cartList"></ul>

      <div class="cart-summary" id="cartSummary" style="display: none;">
        <h2 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Bestellübersicht</h2>
        <div class="summary-row">
          <span style="color: var(--text-muted);">Artikel</span>
          <span id="summaryCount">0</span>
        </div>
        <div class="summary-row">
          <span style="color: var(--text-muted);">Lieferung</span>
          <span>Kostenlos</span>
        </div>
        <div class="summary-total">
          <span>Gesamt</span>
          <span id="summaryTotal">0,00 €</span>
        </div>
        <button class="btn-primary" style="width: 100%; margin-top: 2rem;"
          onclick="window.location.href='checkout.html'">
          Zur Kasse →
        </button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function loadWarenkorb() {
      try {
        const res = await fetch(`${API}/cart`, { credentials: "include" });
        const items = await res.json();
        const list = document.getElementById("cartList");
        const summary = document.getElementById("cartSummary");

        const drinkData = sessionStorage.getItem("drinkImWarenkorb");
        const drink = drinkData ? JSON.parse(drinkData) : null;

        if (items.length === 0 && !drink) {
          list.innerHTML = `
            <div class="cart-empty">
              <h3 style="margin-bottom: 1rem;">Dein Warenkorb ist leer 🛒</h3>
              <a href="shop.html" class="btn-secondary">Zum Shop</a>
            </div>`;
          summary.style.display = "none";
          return;
        }

        let total = 0;
        let count = 0;
        list.innerHTML = "";

        if (drink) {
          total += drink.preis;
          count += 1;
          list.innerHTML += `
            <li class="cart-item">
              <div style="font-size: 3rem; width: 80px; text-align: center;">🍹</div>
              <div class="cart-item-details">
                <div class="cart-item-title">${drink.name}</div>
                <div style="color: var(--text-muted);">Größe: ${drink.groesse}</div>
                <div class="cart-item-actions">
                  <button class="btn-icon-only" onclick="drinkEntfernen()">🗑️</button>
                </div>
              </div>
              <div class="cart-item-price">${drink.preis.toFixed(2).replace(".", ",")} €</div>
            </li>`;
        }

        items.forEach(item => {
          const preis = Number(item.preis) * item.menge;
          total += preis;
          count += item.menge;
          list.innerHTML += `
            <li class="cart-item">
              <img class="cart-item-img" src="${item.bild_url}" alt="${item.name}"
                onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22><rect fill=%22%23f0f0f0%22 width=%22120%22 height=%22120%22/></svg>'">
              <div class="cart-item-details">
                <div class="cart-item-title">${item.name}</div>
                <div class="cart-item-actions">
                  <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <button class="btn-icon-only" onclick="mengeAendern('${item.id}', -1)" style="width:30px;height:30px;">➖</button>
                    <span style="background: var(--bg-light); padding: 0.2rem 0.8rem; border-radius: 4px; font-weight:700;">${item.menge}</span>
                    <button class="btn-icon-only" onclick="mengeAendern('${item.id}', 1)" style="width:30px;height:30px;">➕</button>
                  </div>
                  <button class="btn-icon-only" onclick="removeFromCart('${item.id}')">🗑️</button>
                </div>
              </div>
              <div class="cart-item-price">${preis.toFixed(2).replace(".", ",")} €</div>
            </li>`;
        });

        document.getElementById("summaryCount").textContent = count;
        document.getElementById("summaryTotal").textContent = total.toFixed(2).replace(".", ",") + " €";
        summary.style.display = "block";
      } catch (err) {
        document.getElementById("cartList").innerHTML = "<p>Fehler beim Laden.</p>";
      }
    }

    function drinkEntfernen() {
      sessionStorage.removeItem("drinkImWarenkorb");
      showToast("Drink entfernt");
      loadWarenkorb();
    }

    async function removeFromCart(id) {
      await fetch(`${API}/cart/${id}`, { method: "DELETE", credentials: "include" });
      showToast("Artikel entfernt");
      loadWarenkorb();
      updateCartBadge();
    }

    async function mengeAendern(id, delta) {
      await fetch(`${API}/cart/${id}/menge`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ delta })
      });
      loadWarenkorb();
      updateCartBadge();
    }

    window.loadWarenkorb = loadWarenkorb;
    document.addEventListener("DOMContentLoaded", loadWarenkorb);
  </script>
</body>
</html>
