<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sideboard Konfigurator | Mein Profil</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-grid { display: grid; grid-template-columns: 250px 1fr; gap: 2rem; margin-top: 2rem; }
    .profile-nav { display: flex; flex-direction: column; gap: 0.5rem; }
    .profile-nav button { text-align: left; padding: 1rem; background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-weight: 700; transition: all 0.2s; }
    .profile-nav button.active { border-color: var(--ikea-blue); color: var(--ikea-blue); background: var(--bg-light); }
    .profile-nav button:hover { border-color: var(--ikea-blue); }
    
    .profile-section { display: none; background: var(--bg-white); padding: 2rem; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .profile-section.active { display: block; }
    .profile-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <main>
    <div style="margin-bottom: 2rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Zurück</a>
    </div>

    <h1 class="page-title">Hallo, <span id="usernameDisplay">Kunde</span>!</h1>

    <div class="profile-grid">
      <div class="profile-nav">
        <button class="active" onclick="showSection('konto')">Mein Konto</button>
        <button onclick="showSection('sideboards'); loadSavedSideboards();">Gespeicherte Sideboards</button>
        <button onclick="showSection('bestellungen'); loadOrders();">Meine Bestellungen</button>
        <button onclick="showSection('adressen'); loadAddresses();">Adressbuch</button>
        <button onclick="doLogout()" style="margin-top: 2rem; color: #dc2626; border-color: #dc2626;">Abmelden</button>
      </div>

      <div>
        <!-- KONTO -->
        <div id="konto" class="profile-section active">
          <h2 style="margin-bottom: 1.5rem;">Benutzerkonto</h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
            <div>
              <label style="display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;">Vorname</label>
              <input type="text" id="profVorname" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 4px;" placeholder="Vorname">
            </div>
            <div>
              <label style="display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;">Nachname</label>
              <input type="text" id="profNachname" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 4px;" placeholder="Nachname">
            </div>
            <div style="grid-column: span 2;">
                <label style="display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem;">Telefonnummer</label>
                <input type="text" id="profTelefon" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 4px;" placeholder="Telefonnummer">
            </div>
          </div>
          <button class="btn-primary" onclick="updateProfile()">Profil speichern</button>

          <hr style="border: 0; border-top: 1px solid var(--border); margin: 3rem 0;">

          <h2 style="margin-bottom: 1.5rem;">Passwort ändern</h2>
          <div style="display: flex; flex-direction: column; gap: 1rem; max-width: 400px;">
            <input type="password" id="oldPw" placeholder="Aktuelles Passwort" style="padding: 0.8rem; border: 1px solid var(--border); border-radius: 4px;">
            <input type="password" id="newPw" placeholder="Neues Passwort" style="padding: 0.8rem; border: 1px solid var(--border); border-radius: 4px;">
            <button class="btn-secondary" onclick="changePw()">Passwort aktualisieren</button>
          </div>
        </div>

        <!-- SIDEBOARDS -->
        <div id="sideboards" class="profile-section">
          <h2>Meine Favoriten</h2>
          <p style="color: var(--text-muted); margin-bottom: 2rem;">Hier findest du deine bisher konfigurierten Sideboards.</p>
          <div id="savedSideboardsList" style="display: flex; flex-direction: column; gap: 1rem;">
            Lädt...
          </div>
        </div>

        <!-- BESTELLUNGEN -->
        <div id="bestellungen" class="profile-section">
          <h2>Meine Bestellungen</h2>
          <div id="ordersList" style="display: flex; flex-direction: column; gap: 1.5rem; margin-top: 1.5rem;">
            Lädt...
          </div>
        </div>

        <!-- ADRESSBUCH -->
        <div id="adressen" class="profile-section">
          <div class="profile-header">
             <h2>Adressbuch</h2>
             <button class="btn-secondary" onclick="document.getElementById('neueAdresseForm').style.display='block'">+ Neue Adresse</button>
          </div>

          <div id="neueAdresseForm" style="display:none; background: var(--bg-light); padding: 1.5rem; border-radius: 4px; margin-bottom: 2rem;">
             <h3>Neue Adresse</h3>
             <input type="text" id="adrL1" placeholder="Straße und Hausnummer" style="width: 100%; padding:0.8rem; margin:0.5rem 0; border: 1px solid var(--border);">
             <input type="text" id="adrPLZ" placeholder="PLZ" style="width: 30%; padding:0.8rem; margin-bottom:1rem; border: 1px solid var(--border);">
             <input type="text" id="adrStadt" placeholder="Stadt" style="width: 65%; padding:0.8rem; margin-bottom:1rem; border: 1px solid var(--border);">
             <div style="display:flex; gap: 1rem;">
                 <button class="btn-primary" onclick="saveAddress()">Speichern</button>
                 <button class="btn-secondary" onclick="document.getElementById('neueAdresseForm').style.display='none'">Abbrechen</button>
             </div>
          </div>

          <div id="addressesList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            Lädt...
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    function showSection(id) {
      document.querySelectorAll('.profile-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.profile-nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.classList.add('active');
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${API}/auth/me`, { credentials: "include" });
        if(!res.ok) return window.location.href = "index.html";
        const data = await res.json();
        document.getElementById("usernameDisplay").textContent = data.profile.username;
        document.getElementById("profVorname").value = data.profile.first_name || "";
        document.getElementById("profNachname").value = data.profile.last_name || "";
        document.getElementById("profTelefon").value = data.profile.phone || "";
      } catch(err) { window.location.href="index.html"; }
    }

    async function updateProfile() {
      const data = {
        first_name: document.getElementById("profVorname").value,
        last_name: document.getElementById("profNachname").value,
        phone: document.getElementById("profTelefon").value
      };
      try {
        await fetch(`${API}/user/profile`, { 
          method:"PUT", headers: {"Content-Type":"application/json"}, credentials: "include", body: JSON.stringify(data)
        });
        showToast("Profil aktualisiert!");
      } catch(e) { showToast("Fehler beim Aktualisieren", true); }
    }

    async function changePw() {
      const oldPassword = document.getElementById("oldPw").value;
      const newPassword = document.getElementById("newPw").value;
      if(!oldPassword || !newPassword) return showToast("Bitte beide ausfüllen", true);
      try {
        const res = await fetch(`${API}/auth/password`, {
          method: "PUT", headers: {"Content-Type": "application/json"},
          credentials: "include", body: JSON.stringify({oldPassword, newPassword})
        });
        const daten = await res.json();
        if(res.ok) {
          showToast("Passwort erfolgreich geändert!");
          document.getElementById("oldPw").value = "";
          document.getElementById("newPw").value = "";
        } else showToast(daten.fehler, true);
      } catch(err) { showToast("Fehler beim Ändern", true); }
    }

    // Sideboards
    async function loadSavedSideboards() {
      try {
        const res = await fetch(`${API}/config/saved`, { credentials: "include" });
        if(!res.ok) return;
        const boards = await res.json();
        const list = document.getElementById("savedSideboardsList");
        if(boards.length === 0) { list.innerHTML = `<p>Keine gespeicherten Sideboards.</p>`; return; }
        list.innerHTML = boards.map(b => `
          <div style="display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border); padding:1rem; border-radius:4px;">
            <div>
              <h3 style="margin-bottom:0.3rem;">${b.name}</h3>
              <p style="font-size:0.9rem; color:var(--text-muted);">Erstellt: ${new Date(b.created_at).toLocaleDateString()} | ${b.config_snapshot.groesse}</p>
            </div>
            <div style="display:flex; gap:0.5rem;">
              <button class="btn-primary" onclick="loadSideboard(${b.id})" style="padding:0.5rem 1rem;">Im Konfigurator laden</button>
              <button class="btn-secondary" onclick="deleteSideboard(${b.id})" style="padding:0.5rem 1rem;">Löschen</button>
            </div>
          </div>
        `).join("");
      } catch(err) {}
    }

    async function loadSideboard(id) {
      try {
        const res = await fetch(`${API}/config/saved/${id}/load`, { method: "POST", credentials: "include" });
        if(res.ok) {
          showToast("Im Hintergrund geladen! Umgeleitet...");
          setTimeout(() => window.location.href="konfigurator.html", 1000);
        }
      } catch(err) {}
    }

    async function deleteSideboard(id) {
       if(!confirm("Löschen?")) return;
       await fetch(`${API}/config/saved/${id}`, { method: "DELETE", credentials: "include" });
       loadSavedSideboards();
    }

    // Orders
    async function loadOrders() {
      try {
        const res = await fetch(`${API}/shop/orders`, { credentials: "include" });
        const orders = await res.json();
        const list = document.getElementById("ordersList");
        if(orders.length===0) return list.innerHTML = "Keine Bestellungen vorhanden.";
        list.innerHTML = orders.map(o => `
            <div style="border:1px solid var(--border); padding: 1.5rem; border-radius: 4px;">
                <div style="display:flex; justify-content: space-between; margin-bottom: 1rem;">
                    <strong>Bestellung ${o.order_number}</strong>
                    <span style="background: var(--bg-light); padding: 0.2rem 0.5rem; border-radius: 4px;">${o.status}</span>
                </div>
                <p style="color:var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Vom ${new Date(o.created_at).toLocaleDateString()}</p>
                <p><strong>Total: ${parseFloat(o.total_amount).toFixed(2).replace('.', ',')} €</strong></p>
            </div>
        `).join("");
      } catch(e){}
    }

    // Addresses
    async function loadAddresses() {
       try {
         const res = await fetch(`${API}/user/addresses`, { credentials: "include" });
         const adrs = await res.json();
         const list = document.getElementById("addressesList");
         if(!adrs.length) return list.innerHTML="Keine Adressen.";
         list.innerHTML = adrs.map(a => `
            <div style="border: 1px solid var(--border); padding: 1rem; border-radius: 4px;">
               ${a.is_default ? '<span style="color: green; font-size:0.8rem; font-weight:700;">STANDARD</span><br>' : ''}
               <span>${a.address_line1}</span><br>
               <span>${a.postal_code} ${a.city}</span><br>
               <button onclick="deleteAddress(${a.id})" style="margin-top:0.5rem; background:none; border:none; color:red; cursor:pointer;">Löschen</button>
            </div>
         `).join("");
       } catch(e){}
    }

    async function saveAddress() {
       const data = {
         address_line1: document.getElementById("adrL1").value,
         postal_code: document.getElementById("adrPLZ").value,
         city: document.getElementById("adrStadt").value
       };
       await fetch(`${API}/user/addresses`, { 
         method:"POST", headers:{"Content-Type":"application/json"}, credentials:"include", body:JSON.stringify(data) 
       });
       document.getElementById('neueAdresseForm').style.display='none';
       loadAddresses();
    }

    async function deleteAddress(id) {
       await fetch(`${API}/user/addresses/${id}`, { method: "DELETE", credentials: "include" });
       loadAddresses();
    }

    document.addEventListener("DOMContentLoaded", loadProfile);
  </script>
</body>
</html>
