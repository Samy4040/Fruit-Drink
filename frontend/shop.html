<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FruitDrink | Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🍹 FruitDrink Co.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="konfigurator.html">Konfigurator</a>
      <a href="shop.html">Shop</a>
      <a href="impressionen.html">Impressionen</a>
      <a href="community.html">Community</a>
    </div>
  </nav>

  <main>
    <div style="margin-bottom: 2rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Zurück</a>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 class="page-title" style="margin-bottom: 0;">🛍️ Küchenartikel Shop</h1>
      <a href="warenkorb.html" class="btn-secondary">🛒 Warenkorb</a>
    </div>

    <div class="shop-grid" id="shopGrid">
      <p style="color: var(--text-muted);">Lade Artikel...</p>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function loadShop() {
      try {
        const res = await fetch(`${API}/shop/accessories`, { credentials: "include" });
        const artikel = await res.json();
        const grid = document.getElementById("shopGrid");
        grid.innerHTML = "";
        artikel.forEach(a => {
          const preis = Number(a.preis).toFixed(2).replace(".", ",");
          grid.innerHTML += `
            <div class="product-card">
              <img class="product-image" src="${a.bild_url}" alt="${a.name}"
                onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 200%22><rect fill=%22%23f0f0f0%22 width=%22300%22 height=%22200%22/><text fill=%22%23999%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2214%22>Kein Bild</text></svg>'">
              <h3 class="product-name">${a.name}</h3>
              <p class="product-desc">${a.beschreibung || ""}</p>
              <div class="product-price">${preis} €</div>
              <button class="btn-secondary btn-add-cart" onclick="addToCart(${a.id})">
                🛒 In den Warenkorb
              </button>
            </div>
          `;
        });
      } catch (err) {
        document.getElementById("shopGrid").innerHTML = "<p>Fehler beim Laden.</p>";
      }
    }

    document.addEventListener("DOMContentLoaded", loadShop);
  </script>
</body>
</html>
