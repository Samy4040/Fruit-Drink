<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FruitDrink | Bestellung erfolgreich</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🍹 FruitDrink Co.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="konfigurator.html">Konfigurator</a>
      <a href="shop.html">Shop</a>
      <a href="impressionen.html">Impressionen</a>
      <a href="community.html">Community</a>
    </div>
  </nav>

  <main>
    <div style="text-align: center; max-width: 600px; margin: 4rem auto; background: var(--bg-white); padding: 3rem; border-radius: var(--radius-sm); border: 1px solid var(--border);">
      <div style="font-size: 5rem; margin-bottom: 1rem;">🎉🍹</div>
      <h1 style="margin-bottom: 1rem;">Danke für deine Bestellung!</h1>
      <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem;">
        Deine Bestellung wurde erfolgreich entgegengenommen. Wir bereiten deine Küchenartikel für den Versand vor!
      </p>

      <div style="background: var(--bg-light); padding: 1.5rem; border-radius: var(--radius-sm); margin-bottom: 2rem;">
        <p style="font-weight: 700; margin-bottom: 0.5rem;">Bestellnummer:</p>
        <p id="orderNumber" style="font-family: monospace; font-size: 1.2rem;">-</p>
      </div>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="index.html" class="btn-primary" style="text-decoration: none;">
          🏠 Zurück zur Startseite
        </a>
        <a href="konfigurator.html" class="btn-secondary" style="text-decoration: none;">
          🍹 Neuen Drink erstellen
        </a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const order = params.get("order");
    document.getElementById("orderNumber").textContent = order || "FD-XXXXXXX";
  </script>
</body>
</html>
