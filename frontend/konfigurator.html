<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FruitDrink | Konfigurator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🍹 FruitDrink Co.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="konfigurator.html">Konfigurator</a>
      <a href="shop.html">Shop</a>
      <a href="impressionen.html">Impressionen</a>
      <a href="community.html">Community</a>
    </div>
  </nav>

  <main>
    <div style="margin-bottom: 2rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Zurück</a>
    </div>

    <h1 class="page-title">Erstelle deinen Fruit Drink 🍹</h1>

    <div class="card">
      <div class="konfig-grid">

        <!-- Vorschau links -->
        <div class="vorschau-container">
          <div id="drinkVorschau" style="font-size: 8rem; text-align: center; padding: 2rem; background: linear-gradient(135deg, #fff9f0, #fff); border-radius: 1rem; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div id="drinkEmoji" style="font-size: 6rem;">🍹</div>
            <div id="drinkName" style="margin-top: 1rem; font-size: 1.2rem; font-weight: 700; color: #333;">Dein Drink</div>
            <div id="drinkZutaten" style="margin-top: 0.5rem; font-size: 0.9rem; color: #888;">Wähle deine Früchte</div>
          </div>
          <div style="margin-top: 1rem; text-align: center;">
            <span style="color: var(--text-muted);">Preis:</span>
            <span id="livePreis" style="font-size: 1.8rem; font-weight: 800; margin-left: 0.5rem;">2,99 €</span>
          </div>
        </div>

        <!-- Optionen rechts -->
        <div class="optionen">

          <div class="option-gruppe">
            <label>1. Erste Frucht (Pflicht)</label>
            <div class="auswahl-buttons" id="frucht1Buttons">
              <button class="auswahl-btn" data-wert="apfel" onclick="waehleOption('frucht1', 'apfel')">🍎 Apfel</button>
              <button class="auswahl-btn" data-wert="orange" onclick="waehleOption('frucht1', 'orange')">🍊 Orange</button>
              <button class="auswahl-btn" data-wert="mango" onclick="waehleOption('frucht1', 'mango')">🥭 Mango</button>
              <button class="auswahl-btn" data-wert="erdbeere" onclick="waehleOption('frucht1', 'erdbeere')">🍓 Erdbeere</button>
              <button class="auswahl-btn" data-wert="ananas" onclick="waehleOption('frucht1', 'ananas')">🍍 Ananas</button>
              <button class="auswahl-btn" data-wert="kiwi" onclick="waehleOption('frucht1', 'kiwi')">🥝 Kiwi</button>
            </div>
          </div>

          <div class="option-gruppe">
            <label>2. Zweite Frucht (optional)</label>
            <div class="auswahl-buttons" id="frucht2Buttons">
              <button class="auswahl-btn aktiv" data-wert="keine" onclick="waehleOption('frucht2', 'keine')">❌ Keine</button>
              <button class="auswahl-btn" data-wert="apfel" onclick="waehleOption('frucht2', 'apfel')">🍎 Apfel</button>
              <button class="auswahl-btn" data-wert="orange" onclick="waehleOption('frucht2', 'orange')">🍊 Orange</button>
              <button class="auswahl-btn" data-wert="mango" onclick="waehleOption('frucht2', 'mango')">🥭 Mango</button>
              <button class="auswahl-btn" data-wert="himbeere" onclick="waehleOption('frucht2', 'himbeere')">🫐 Himbeere</button>
              <button class="auswahl-btn" data-wert="zitrone" onclick="waehleOption('frucht2', 'zitrone')">🍋 Zitrone</button>
            </div>
          </div>

          <div class="option-gruppe">
            <label>3. Dritte Frucht (optional)</label>
            <div class="auswahl-buttons" id="frucht3Buttons">
              <button class="auswahl-btn aktiv" data-wert="keine" onclick="waehleOption('frucht3', 'keine')">❌ Keine</button>
              <button class="auswahl-btn" data-wert="apfel" onclick="waehleOption('frucht3', 'apfel')">🍎 Apfel</button>
              <button class="auswahl-btn" data-wert="orange" onclick="waehleOption('frucht3', 'orange')">🍊 Orange</button>
              <button class="auswahl-btn" data-wert="mango" onclick="waehleOption('frucht3', 'mango')">🥭 Mango</button>
              <button class="auswahl-btn" data-wert="erdbeere" onclick="waehleOption('frucht3', 'erdbeere')">🍓 Erdbeere</button>
              <button class="auswahl-btn" data-wert="ananas" onclick="waehleOption('frucht3', 'ananas')">🍍 Ananas</button>
            </div>
          </div>

          <div class="option-gruppe">
            <label>4. Größe</label>
            <div class="auswahl-buttons" id="groesseButtons">
              <button class="auswahl-btn" data-wert="klein" onclick="waehleOption('groesse', 'klein')">Klein 250ml (1,99€)</button>
              <button class="auswahl-btn" data-wert="mittel" onclick="waehleOption('groesse', 'mittel')">Mittel 500ml (2,99€)</button>
              <button class="auswahl-btn" data-wert="gross" onclick="waehleOption('groesse', 'gross')">Groß 750ml (3,99€)</button>
            </div>
          </div>

          <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
            
         <button class="btn-secondary" style="width: 100%;" onclick="drinkInWarenkorb()">
  🛒 Drink in den Warenkorb
</button>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const fruchtemoji = {
      apfel: "🍎", orange: "🍊", mango: "🥭", erdbeere: "🍓",
      ananas: "🍍", kiwi: "🥝", himbeere: "🫐", zitrone: "🍋", keine: ""
    };

    let konfig = { frucht1: "apfel", frucht2: "keine", frucht3: "keine", groesse: "mittel" };

    function rechnePreis() {
      const preise = { klein: 1.99, mittel: 2.99, gross: 3.99 };
      const preis = preise[konfig.groesse] || 2.99;
      document.getElementById("livePreis").textContent = preis.toFixed(2).replace(".", ",") + " €";
    }

    function aktualisiereVorschau() {
      const f1 = fruchtemoji[konfig.frucht1] || "🍹";
      const f2 = konfig.frucht2 !== "keine" ? fruchtemoji[konfig.frucht2] : "";
      const f3 = konfig.frucht3 !== "keine" ? fruchtemoji[konfig.frucht3] : "";
      document.getElementById("drinkEmoji").textContent = f1 + f2 + f3 + "🥤";
      const zutaten = [konfig.frucht1, konfig.frucht2, konfig.frucht3]
        .filter(f => f !== "keine").join(" + ");
      document.getElementById("drinkZutaten").textContent = zutaten;
    }

    function waehleOption(typ, wert) {
      konfig[typ] = wert;
      const containerId = typ + "Buttons";
      document.querySelectorAll(`#${containerId} .auswahl-btn`).forEach(btn => {
        btn.classList.toggle("aktiv", btn.dataset.wert === wert);
      });
      aktualisiereVorschau();
      rechnePreis();
    }

    async function speichereKonfiguration() {
      try {
        const res = await fetch(`${API}/config`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(konfig)
        });
        const daten = await res.json();
        if (daten.erfolg) showToast("Konfiguration gespeichert! 🍹");
      } catch (err) {
        showToast("Fehler beim Speichern", true);
      }
    }
async function drinkInWarenkorb() {
  await speichereKonfiguration();
  const preise = { klein: 1.99, mittel: 2.99, gross: 3.99 };
  const preis = preise[konfig.groesse] || 2.99;
  const zutaten = [konfig.frucht1, konfig.frucht2, konfig.frucht3]
    .filter(f => f && f !== "keine").join(" + ");
  
  sessionStorage.setItem("drinkImWarenkorb", JSON.stringify({
    name: "🍹 " + zutaten,
    preis: preis,
    groesse: konfig.groesse
  }));
  
  showToast("Drink in den Warenkorb gelegt! 🍹");
  setTimeout(() => window.location.href = "warenkorb.html", 1000);
}
    async function ladeKonfiguration() {
      try {
        const res = await fetch(`${API}/config`, { credentials: "include" });
        const daten = await res.json();
        if (daten.frucht1) {
          waehleOption("frucht1", daten.frucht1);
          waehleOption("frucht2", daten.frucht2 || "keine");
          waehleOption("frucht3", daten.frucht3 || "keine");
          waehleOption("groesse", daten.groesse || "mittel");
        }
      } catch (err) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      waehleOption("frucht1", "apfel");
      waehleOption("groesse", "mittel");
      ladeKonfiguration();
    });
  </script>
</body>
</html>
