<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FruitDrink | Konfigurator</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .mixer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .mixer-wrapper {
      position: relative;
      width: 200px;
      height: 280px;
    }

    .mixer-glas {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 180px;
      background: rgba(200, 240, 255, 0.25);
      border: 3px solid rgba(100, 180, 220, 0.7);
      border-top: none;
      border-radius: 0 0 30px 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8px;
      box-shadow: inset 0 0 20px rgba(100,200,255,0.2), 2px 2px 8px rgba(0,0,0,0.1);
    }

    .mixer-glas::before {
      content: '';
      position: absolute;
      top: 0; left: 8px;
      width: 15px;
      height: 100%;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
    }

    .mixer-deckel {
      position: absolute;
      bottom: 235px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 20px;
      background: linear-gradient(135deg, #607D8B, #90A4AE);
      border-radius: 5px 5px 0 0;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
    }

    .mixer-knopf {
      position: absolute;
      bottom: 252px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 18px;
      background: #37474F;
      border-radius: 50% 50% 0 0;
    }

    .mixer-base {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 65px;
      background: linear-gradient(135deg, #546E7A, #78909C);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .mixer-base::after {
      content: 'FRUITDRINK';
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      font-weight: 800;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .mixer-motor {
      position: absolute;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 12px;
      background: linear-gradient(135deg, #455A64, #607D8B);
      border-radius: 3px;
    }

    .frucht-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
      padding: 4px;
    }

    .frucht-reihe {
      display: flex;
      justify-content: center;
      gap: 2px;
      width: 100%;
    }

    .frucht-emoji {
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      line-height: 1;
      filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.2));
    }

    .frucht-emoji.einfall {
      animation: einfall 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes einfall {
      0% { transform: translateY(-60px) scale(0.3); opacity: 0; }
      60% { transform: translateY(8px) scale(1.2); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .mixer-wrapper.mixen {
      animation: mixerWackeln 0.15s ease-in-out infinite;
    }

    @keyframes mixerWackeln {
      0%   { transform: rotate(-2deg) translateX(-3px); }
      25%  { transform: rotate(2deg) translateX(3px); }
      50%  { transform: rotate(-2deg) translateX(-3px); }
      75%  { transform: rotate(1deg) translateX(2px); }
      100% { transform: rotate(-1deg) translateX(-2px); }
    }

    .mixen-btn {
      width: 160px;
      height: 50px;
      border-radius: 50px;
      background: linear-gradient(135deg, #2E7D32, #4CAF50);
      color: white;
      font-size: 1.2rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 4px 15px rgba(46,125,50,0.4);
      transition: all 0.3s ease;
      letter-spacing: 2px;
    }

    .mixen-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(46,125,50,0.5);
    }

    .mixen-btn:active {
      transform: scale(0.95);
    }

    .mixen-btn.am-mixen {
      background: linear-gradient(135deg, #F57F17, #FFC107);
      animation: btnPuls 0.3s ease-in-out infinite alternate;
    }

    @keyframes btnPuls {
      0% { box-shadow: 0 4px 15px rgba(245,127,23,0.4); }
      100% { box-shadow: 0 8px 25px rgba(245,127,23,0.8); }
    }

    .preis-badge {
      text-align: center;
      margin-top: 0.8rem;
    }

    .leer-hinweis {
      font-size: 2.5rem;
      opacity: 0.3;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🍹 FruitDrink Co.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="konfigurator.html">Konfigurator</a>
      <a href="shop.html">Shop</a>
      <a href="impressionen.html">Impressionen</a>
      <a href="community.html">Community</a>
    </div>
  </nav>

  <main>
    <div style="margin-bottom: 2rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Zurück</a>
    </div>

    <h1 class="page-title">Erstelle deinen Fruit Drink 🍹</h1>

    <div class="card">
      <div class="konfig-grid">

        <!-- Mixer Vorschau links -->
        <div class="vorschau-container">
          <div class="mixer-container">
            <div class="mixer-wrapper" id="mixerWrapper">
              <div class="mixer-knopf"></div>
              <div class="mixer-deckel"></div>
              <div class="mixer-glas" id="mixerGlas">
                <div class="frucht-stack" id="fruchtStack">
                  <div class="leer-hinweis" id="leerHinweis">🫙</div>
                </div>
              </div>
              <div class="mixer-motor"></div>
              <div class="mixer-base"></div>
            </div>

            <button class="mixen-btn" id="mixenBtn" onclick="mixen()">⚡ MIXEN</button>

            <div class="preis-badge">
              <span style="color: var(--text-muted); font-size: 0.9rem;">Preis:</span>
              <span id="livePreis" style="font-size: 1.8rem; font-weight: 800; margin-left: 0.3rem;">2,99 €</span>
            </div>
          </div>
        </div>

        <!-- Optionen rechts -->
        <div class="optionen">

          <div class="option-gruppe">
            <label>1. Erste Frucht (Pflicht)</label>
            <div class="auswahl-buttons" id="frucht1Buttons">
              <button class="auswahl-btn" data-wert="apfel" onclick="waehleOption('frucht1', 'apfel')">🍎 Apfel</button>
              <button class="auswahl-btn" data-wert="orange" onclick="waehleOption('frucht1', 'orange')">🍊 Orange</button>
              <button class="auswahl-btn" data-wert="mango" onclick="waehleOption('frucht1', 'mango')">🥭 Mango</button>
              <button class="auswahl-btn" data-wert="erdbeere" onclick="waehleOption('frucht1', 'erdbeere')">🍓 Erdbeere</button>
              <button class="auswahl-btn" data-wert="ananas" onclick="waehleOption('frucht1', 'ananas')">🍍 Ananas</button>
              <button class="auswahl-btn" data-wert="kiwi" onclick="waehleOption('frucht1', 'kiwi')">🥝 Kiwi</button>
            </div>
          </div>

          <div class="option-gruppe">
            <label>2. Zweite Frucht (optional)</label>
            <div class="auswahl-buttons" id="frucht2Buttons">
              <button class="auswahl-btn aktiv" data-wert="keine" onclick="waehleOption('frucht2', 'keine')">❌ Keine</button>
              <button class="auswahl-btn" data-wert="apfel" onclick="waehleOption('frucht2', 'apfel')">🍎 Apfel</button>
              <button class="auswahl-btn" data-wert="orange" onclick="waehleOption('frucht2', 'orange')">🍊 Orange</button>
              <button class="auswahl-btn" data-wert="mango" onclick="waehleOption('frucht2', 'mango')">🥭 Mango</button>
              <button class="auswahl-btn" data-wert="himbeere" onclick="waehleOption('frucht2', 'himbeere')">🫐 Himbeere</button>
              <button class="auswahl-btn" data-wert="zitrone" onclick="waehleOption('frucht2', 'zitrone')">🍋 Zitrone</button>
            </div>
          </div>

          <div class="option-gruppe">
            <label>3. Dritte Frucht (optional)</label>
            <div class="auswahl-buttons" id="frucht3Buttons">
              <button class="auswahl-btn aktiv" data-wert="keine" onclick="waehleOption('frucht3', 'keine')">❌ Keine</button>
              <button class="auswahl-btn" data-wert="apfel" onclick="waehleOption('frucht3', 'apfel')">🍎 Apfel</button>
              <button class="auswahl-btn" data-wert="orange" onclick="waehleOption('frucht3', 'orange')">🍊 Orange</button>
              <button class="auswahl-btn" data-wert="mango" onclick="waehleOption('frucht3', 'mango')">🥭 Mango</button>
              <button class="auswahl-btn" data-wert="erdbeere" onclick="waehleOption('frucht3', 'erdbeere')">🍓 Erdbeere</button>
              <button class="auswahl-btn" data-wert="ananas" onclick="waehleOption('frucht3', 'ananas')">🍍 Ananas</button>
            </div>
          </div>
<div class="option-gruppe">
  <label>4. Eiswürfel</label>
  <div class="auswahl-buttons" id="eisButtons">
    <button class="auswahl-btn aktiv" data-wert="kein" onclick="waehleOption('eis', 'kein')">❌ Kein Eis</button>
    <button class="auswahl-btn" data-wert="eis" onclick="waehleOption('eis', 'eis')">🧊 Mit Eis</button>
  </div>
</div>
          <div class="option-gruppe">
            <label>5. Größe</label>
            <div class="auswahl-buttons" id="groesseButtons">
              <button class="auswahl-btn" data-wert="klein" onclick="waehleOption('groesse', 'klein')">Klein 250ml (1,99€)</button>
              <button class="auswahl-btn" data-wert="mittel" onclick="waehleOption('groesse', 'mittel')">Mittel 500ml (2,99€)</button>
              <button class="auswahl-btn" data-wert="gross" onclick="waehleOption('groesse', 'gross')">Groß 750ml (3,99€)</button>
            </div>
          </div>

          <div style="margin-top: 2rem;">
            <button class="btn-primary" style="width: 100%;" onclick="drinkInWarenkorb()">
              🛒 Drink in den Warenkorb
            </button>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const fruchtemoji = {
  apfel: "🍎", orange: "🍊", mango: "🥭", erdbeere: "🍓",
  ananas: "🍍", kiwi: "🥝", himbeere: "🫐", zitrone: "🍋", eis: "🧊"
};

    let konfig = { frucht1: null, frucht2: "keine", frucht3: "keine", groesse: "klein", eis: "kein" };
    let amMixen = false;

    function rechnePreis() {
      const preise = { klein: 1.99, mittel: 2.99, gross: 3.99 };
      const preis = preise[konfig.groesse] || 2.99;
      document.getElementById("livePreis").textContent = preis.toFixed(2).replace(".", ",") + " €";
    }

    function aktualisiereVorschau() {
      const stack = document.getElementById("fruchtStack");
      const leer = document.getElementById("leerHinweis");
      const mengen = { klein: 1, mittel: 2, gross: 3 };
      const menge = mengen[konfig.groesse] || 2;

      const fruchten = [konfig.frucht1, konfig.frucht2, konfig.frucht3]
  .filter(f => f && f !== "keine");
if (konfig.eis === "eis") fruchten.push("eis");

      if (fruchten.length === 0) {
        stack.innerHTML = '<div class="leer-hinweis" id="leerHinweis">🫙</div>';
        return;
      }

      // Berechne Emoji-Größe je nach Anzahl
      const total = fruchten.length * menge;
      const size = total <= 3 ? "2rem" : total <= 6 ? "1.5rem" : "1.1rem";

      stack.innerHTML = "";

      // Baue Reihen: jede Frucht menge-mal, gestapelt
      fruchten.forEach((frucht, fi) => {
        const reihe = document.createElement("div");
        reihe.className = "frucht-reihe";
        for (let i = 0; i < menge; i++) {
          const span = document.createElement("span");
          span.className = "frucht-emoji einfall";
          span.style.fontSize = size;
          span.textContent = fruchtemoji[frucht];
          span.style.animationDelay = (fi * menge + i) * 0.08 + "s";
          reihe.appendChild(span);
        }
        stack.appendChild(reihe);
      });
    }

    function waehleOption(typ, wert) {
      konfig[typ] = wert;
      const containerId = typ + "Buttons";
      document.querySelectorAll(`#${containerId} .auswahl-btn`).forEach(btn => {
        btn.classList.toggle("aktiv", btn.dataset.wert === wert);
      });
      aktualisiereVorschau();
      rechnePreis();
    }

    function mixen() {
      const fruchten = [konfig.frucht1, konfig.frucht2, konfig.frucht3]
        .filter(f => f && f !== "keine");

      if (fruchten.length === 0) {
        showToast("Bitte erst Früchte auswählen! 🍎", true);
        return;
      }

      if (amMixen) return;
      amMixen = true;

      const wrapper = document.getElementById("mixerWrapper");
      const btn = document.getElementById("mixenBtn");

      wrapper.classList.add("mixen");
      btn.classList.add("am-mixen");
      btn.textContent = "⚡ MIXEN...";

      setTimeout(() => {
        wrapper.classList.remove("mixen");
        btn.classList.remove("am-mixen");
        btn.textContent = "⚡ MIXEN";
        amMixen = false;
        showToast("Perfekt gemixt! 🍹");
      }, 2500);
    }

    async function speichereKonfiguration() {
      try {
        await fetch(`${API}/config`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(konfig)
        });
      } catch (err) {}
    }

    async function drinkInWarenkorb() {
      if (!konfig.frucht1) {
        showToast("Bitte erst eine Frucht wählen! 🍎", true);
        return;
      }
      await speichereKonfiguration();
      const preise = { klein: 1.99, mittel: 2.99, gross: 3.99 };
      const preis = preise[konfig.groesse] || 2.99;
      const zutaten = [konfig.frucht1, konfig.frucht2, konfig.frucht3]
        .filter(f => f && f !== "keine").join(" + ");

      sessionStorage.setItem("drinkImWarenkorb", JSON.stringify({
        name: "🍹 " + zutaten,
        preis: preis,
        groesse: konfig.groesse
      }));

      showToast("Drink in den Warenkorb gelegt! 🍹");
      setTimeout(() => window.location.href = "warenkorb.html", 1000);
    }

    async function ladeKonfiguration() {
      try {
        const res = await fetch(`${API}/config`, { credentials: "include" });
        const daten = await res.json();
        if (daten.frucht1) {
          waehleOption("frucht1", daten.frucht1);
          if (daten.frucht2 && daten.frucht2 !== "keine") waehleOption("frucht2", daten.frucht2);
          if (daten.frucht3 && daten.frucht3 !== "keine") waehleOption("frucht3", daten.frucht3);
          waehleOption("groesse", daten.groesse || "mittel");
        }
      } catch (err) {}
    }

  document.addEventListener("DOMContentLoaded", () => {
  waehleOption("groesse", "klein");
});
  </script>
</body>
</html>
