<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FruitDrink | Kasse</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .checkout-form {
      background: var(--bg-white);
      padding: 2.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 700; }
    .form-group input {
      width: 100%; padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit; box-sizing: border-box;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🍹 FruitDrink Co.</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="konfigurator.html">Konfigurator</a>
      <a href="shop.html">Shop</a>
      <a href="impressionen.html">Impressionen</a>
      <a href="community.html">Community</a>
    </div>
  </nav>

  <main>
    <div style="margin-bottom: 2rem;">
      <a href="warenkorb.html" style="color: var(--text-muted); text-decoration: none;">&larr; Zurück zum Warenkorb</a>
    </div>

    <h1 class="page-title" style="text-align: center;">💳 Kasse</h1>

    <div class="checkout-form">
      <h2 style="margin-bottom: 2rem;">Lieferadresse</h2>

      <form id="checkoutForm">
        <div class="form-row">
          <div class="form-group">
            <label>Vorname</label>
            <input type="text" id="vorname" required placeholder="Max">
          </div>
          <div class="form-group">
            <label>Nachname</label>
            <input type="text" id="nachname" required placeholder="Mustermann">
          </div>
        </div>
        <div class="form-group">
          <label>E-Mail</label>
          <input type="email" id="email" required placeholder="max@example.com">
        </div>
        <div class="form-group">
          <label>Straße und Hausnummer</label>
          <input type="text" id="adresse" required placeholder="Musterstraße 1, 12345 Berlin">
        </div>

        <hr style="border: none; border-top: 1px solid var(--border); margin: 2rem 0;">

        <h2 style="margin-bottom: 1.5rem;">Zahlung</h2>
        <div style="background: var(--bg-light); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 2rem; border: 1px solid var(--border);">
          <p style="font-weight: 700; margin-bottom: 0.5rem;">💰 Zahlung auf Rechnung</p>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Die Rechnung wird nach der Lieferung verschickt.</p>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1.2rem;">
          Jetzt bestellen 🍹
        </button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      btn.textContent = "Verarbeite...";

      try {
        const res = await fetch(`${API}/cart/checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            vorname: document.getElementById("vorname").value,
            nachname: document.getElementById("nachname").value,
            email: document.getElementById("email").value,
            adresse: document.getElementById("adresse").value
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = `erfolg.html?order=${data.order_number}`;
        } else {
          showToast(data.fehler || "Fehler beim Bestellen", true);
          btn.disabled = false;
          btn.textContent = "Jetzt bestellen 🍹";
        }
      } catch (err) {
        showToast("Netzwerkfehler", true);
        btn.disabled = false;
        btn.textContent = "Jetzt bestellen 🍹";
      }
    });
  </script>
</body>
</html>
