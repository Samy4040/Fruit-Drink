services:

  # ════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════

  mysql:
    image: mysql:8.0
    container_name: fruitdrink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fruitdrink123}
      MYSQL_DATABASE: fruitdrink_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pfruitdrink123"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: fruitdrink-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # MICROSERVICES
  # ════════════════════════════════════════════════════════════

  konfigurator-service:
    build: ./services/konfigurator-service
    container_name: fruitdrink-konfigurator
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fruitdrink123}
      DB_NAME: fruitdrink_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-fruitdrink-secret}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  shop-service:
    build: ./services/shop-service
    container_name: fruitdrink-shop
    restart: always
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fruitdrink123}
      DB_NAME: fruitdrink_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-fruitdrink-secret}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  community-service:
    build: ./services/community-service
    container_name: fruitdrink-community
    restart: always
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fruitdrink123}
      DB_NAME: fruitdrink_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-fruitdrink-secret}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════
  # API GATEWAY
  # ════════════════════════════════════════════════════════════

  api-gateway:
    build: ./services/api-gateway
    container_name: fruitdrink-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      LB_KONFIGURATOR_URL: http://lb-konfigurator:80
      LB_SHOP_URL: http://lb-shop:80
      LB_COMMUNITY_URL: http://lb-community:80
    depends_on:
      - lb-konfigurator
      - lb-shop
      - lb-community

  # ════════════════════════════════════════════════════════════
  # LOAD BALANCERS
  # ════════════════════════════════════════════════════════════

  lb-konfigurator:
    image: nginx:alpine
    container_name: fruitdrink-lb-konfigurator
    restart: always
    volumes:
      - ./load-balancers/lb-konfigurator:/etc/nginx/conf.d:ro
    depends_on:
      - konfigurator-service

  lb-shop:
    image: nginx:alpine
    container_name: fruitdrink-lb-shop
    restart: always
    volumes:
      - ./load-balancers/lb-shop:/etc/nginx/conf.d:ro
    depends_on:
      - shop-service

  lb-community:
    image: nginx:alpine
    container_name: fruitdrink-lb-community
    restart: always
    volumes:
      - ./load-balancers/lb-community:/etc/nginx/conf.d:ro
    depends_on:
      - community-service

  # ════════════════════════════════════════════════════════════
  # FRONTEND
  # ════════════════════════════════════════════════════════════

  frontend:
    build: ./frontend
    container_name: fruitdrink-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data: